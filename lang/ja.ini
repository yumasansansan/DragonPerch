;
; Japanese. One file per language, and a language that is not installed simply falls back to
; the English the call site carries -- see src/core/dragonperch/language.hpp.
;
; The key is an id, not the English. An English sentence may contain '=' or ';' or '#',
; every one of which this file format would read as punctuation, and rewording the English
; would silently orphan the translation.

[Strings]

; The tray menu, on both platforms and in all three programs that draw one.
menu.pause = 一時停止
menu.resume = 再開
menu.settings = 設定...
menu.quit = DragonPerch を終了

; The settings window on Windows and the settings module on Linux. The same words, because
; they are the same settings.
settings.pets = 1種類あたりの表示数
settings.pets.note = マスコットが3種類の場合、それぞれ2体で合計6体になります。
settings.mascots = マスコット
settings.mascots.note = どのマスコットを表示するかを選択します。すべてオフにすると、すべてオンにした場合と同じになります。
settings.mascots.none = 実行ファイル（デーモン）と同じフォルダにスプライトパックが見つかりません。
; The KDE page splits the note in two, because Kirigami puts the label beside the
; control rather than above it and the long form does not fit there.
settings.mascots.note.short = すべてオフにすると、すべてオンにした場合と同じになります。
settings.speed = 歩く速さ
settings.speed.note = 1秒間に進むピクセル数です。歩行アニメーションは「42」を想定して作られています。これより速すぎると足が滑って見え、遅すぎるとムーンウォークのようになってしまいます。
settings.idle = ランダムに立ち止まる
settings.idle.note = 自発的に立ち止まるまでの平均間隔（秒）。0に設定すると立ち止まらなくなります。
settings.monitors = モニタ
settings.monitors.note = マスコットの表示を許可するモニタです。すべてオフにすると、すべてオンにした場合と同じになります。
settings.fullscreen = 全画面アプリを邪魔しない
settings.fullscreen.note = アプリが全画面表示されているモニタでは、マスコットを非表示にします。
settings.on = オン
settings.off = オフ
settings.close = 閉じる
settings.apply = 適用
settings.saved = 保存しました。
settings.saved.not-running = 保存しました（現在 DragonPerch は実行されていません）。
settings.save-failed = 設定を保存できませんでした。
settings.not-running = 現在 DragonPerch は実行されていません。ここで保存した設定は、次回の起動時に適用されます。
