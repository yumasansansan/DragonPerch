name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in sync with the compiler pinned in CMakePresets.json.
  #
  # ubuntu-26.04 ships Clang 20, 21 and 22 -- not 23 -- so the step below fetches it. That
  # step is a no-op once the image carries this version, and switching back to a version the
  # image already has removes the install entirely.
  LLVM_VERSION: "23"

jobs:
  linux:
    name: linux (Clang ${{ matrix.configuration }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Ensure Clang ${{ env.LLVM_VERSION }}
        run: |
          set -euo pipefail
          if command -v "clang++-${LLVM_VERSION}" >/dev/null 2>&1; then
            echo "clang++-${LLVM_VERSION} is already on the image"
            exit 0
          fi
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"

      - name: Configure
        run: cmake --preset linux-x64

      # The portability guard, built first and named so its failure is unambiguous. The core
      # must compile with no platform anything; if this step breaks, a backend has leaked
      # upwards, which is the one rule the cross-platform design rests on.
      - name: Build core only (portability guard)
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }} --target dragonperch_core

      - name: Build everything
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }}

  windows:
    name: windows (MSVC ${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      # No toolchain setup step. The image carries Visual Studio 2026, and the Visual Studio
      # generator locates and configures MSVC itself -- so CI builds through the same
      # solution a developer opens locally rather than a parallel configuration that drifts.
      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build build/windows-x64 --config ${{ matrix.configuration }}
