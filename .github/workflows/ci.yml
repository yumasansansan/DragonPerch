# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

  # A nightly rebuild as well as one per push, so that a package is never more than a day
  # older than its dependencies -- a build that stopped working because Ubuntu moved
  # underneath it should be found by CI rather than by somebody installing the package.
  # 18:00 UTC is 03:00 in JST.
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

# The Windows job installs no toolchain at all: windows-2025-vs2026 carries Visual Studio
# 2026, and the Visual Studio generator configures MSVC itself. Installing any of it again
# could only pin something older than the image already has.
#
# The Linux jobs do install one, and it is not for want of a compiler on the image -- it is
# that this project builds with the newest Clang there is and ubuntu-26.04's is a release
# or two behind. That is .github/actions/llvm, shared by both of them.
#
# The apt steps below are a third thing again: those are the *dependencies* the Wayland
# head links against, not a compiler. The image has no reason to carry them.
jobs:
  linux:
    name: linux (Clang, ${{ matrix.configuration }}${{ matrix.sanitize == 'ON' && ', Sanitized' || '' }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        sanitize: [OFF, ON]
        exclude:
          - configuration: Debug
            sanitize: ON
    steps:
      # The Wayland protocol definitions are submodules -- see cmake/WaylandProtocol.cmake
      # for why they are not copied into the tree.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # wayland-scanner turns the protocol XML into C; the rest is what the head links
      # against. libsystemd is there for sd-bus, which is how the KWin script reaches us.
      - name: Install the Wayland head's dependencies
        run: |
          sudo apt-get update
          sudo apt-get purge -y snap snapd firefox
          sudo apt-get full-upgrade -y
          sudo apt-get install --no-install-recommends -y libwayland-bin libwayland-dev libwayland-egl-backend-dev libegl-dev libgles-dev libpng-dev libsystemd-dev

      # The settings module's own, kept separate because they are a different kind of thing:
      # the daemon links none of them and must keep building on a machine with none of them.
      # Built here anyway, so that the package is complete and so that the half of milestone
      # 10 that only KDE users see is compiled by something other than the person who wrote
      # it.
      - name: Install the settings module's dependencies
        run: |
          sudo apt-get install --no-install-recommends -y             qt6-base-dev qt6-declarative-dev extra-cmake-modules             libkf6config-dev libkf6coreaddons-dev libkf6i18n-dev libkf6kcmutils-dev

      - uses: ./.github/actions/llvm

      # The preset points at cmake/ClangLatest.cmake, which picks the newest clang++ on
      # the machine -- whichever of the ones installed above that turns out to be. Plain
      # `clang` is not it: on this image the unsuffixed name is the distribution's older
      # one, so asking for it would quietly build with that.
      # The version carries the build time and the commit, so that apt can tell one
      # nightly from the next -- see cmake/Packaging.cmake for why the tilde matters.
      - name: Configure
        run: cmake --preset linux-x64 -D DRAGONPERCH_VERSION_SUFFIX="~$(date -u +%Y%m%d.%H%M).g$(git rev-parse --short HEAD)${{ matrix.sanitize == 'ON' && '~sanitized' || '' }}" -D DRAGONPERCH_SANITIZE=${{ matrix.sanitize }} -D DRAGONPERCH_BUILD_KCM=ON

      # The portability guard, built first and named so its failure is unambiguous. The core
      # must compile with no platform anything; if this step breaks, a backend has leaked
      # upwards, which is the one rule the cross-platform design rests on.
      - name: Build core only (portability guard)
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }} --target dragonperch_core

      - name: Build everything
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }}

      # No ASAN_OPTIONS. LeakSanitizer is part of AddressSanitizer on Linux and is on by
      # default; turning it off is the one thing that would make this step cheaper and
      # worth less. A daemon meant to be left running all day is exactly what leak
      # detection is for.
      - name: Test
        run: ctest --test-dir build/linux-x64 --build-config ${{ matrix.configuration }} --output-on-failure

      # A fuzzer nobody runs is decoration, so the sanitized leg runs each one for half a
      # minute over its seed corpus. That is not long enough to find much on its own; what
      # it is long enough for is to keep finding the thing somebody broke this week, and to
      # prove the corpus still parses.
      #
      # The targets exist only in this configuration -- see fuzz/CMakeLists.txt -- because
      # they are built on the same `-fsanitize=...,fuzzer-no-link` instrumentation the
      # sanitized build already puts on every object.
      - name: Fuzz the parsers
        if: matrix.sanitize == 'ON'
        working-directory: build/linux-x64
        run: |
          for target in fuzz/Release/dragonperch_fuzz_*; do
            name=$(basename "$target")
            corpus="fuzz/Release/corpus/${name#dragonperch_fuzz_}"
            echo "::group::$name"
            "./$target" "$corpus" -max_total_time=30 -print_final_stats=1
            echo "::endgroup::"
          done

      # Whatever libFuzzer wrote before it stopped. These are the only artifacts here worth
      # having on a failure, and they are the ones that are gone when the runner is.
      - name: Keep the fuzzer's findings
        if: failure() && matrix.sanitize == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.configuration }}
          path: |
            build/linux-x64/crash-*
            build/linux-x64/leak-*
            build/linux-x64/timeout-*
            build/linux-x64/oom-*
          if-no-files-found: ignore
          retention-days: 14

      # Release only. A Debug package would be several times the size and slower for no
      # reason anybody downloading it would want.
      - name: Package
        if: matrix.configuration == 'Release'
        run: cpack -C Release
        working-directory: build/linux-x64

      # The version apt actually compares lives in the package's control field, not in the
      # file name -- which matters here because GitHub rewrites `~` to `.` in release asset
      # names, so what gets downloaded looks like a release rather than a nightly. Print
      # the real one, and prove it orders the way a pre-release must, so that neither has
      # to be taken on trust again.
      - name: Check the version apt will see
        if: matrix.configuration == 'Release'
        working-directory: build/linux-x64
        run: |
          deb=$(ls *.deb)
          version=$(dpkg-deb -f "$deb" Version)
          echo "file name:     $deb"
          echo "control field: $version"
          release=${version%%\~*}
          dpkg --compare-versions "$version" lt "$release"
          echo "$version sorts before $release, as a nightly of it must"

      - name: Upload the packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: dragonperch-linux-x86_64${{ matrix.sanitize == 'ON' && '-sanitized' || '' }}
          path: |
            build/linux-x64/*.deb
            build/linux-x64/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows (MSVC, ${{ matrix.configuration }}${{ matrix.sanitize == 'ON' && ', Sanitized' || '' }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        sanitize: [OFF, ON]
        exclude:
          - configuration: Debug
            sanitize: ON
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # CI builds through the same solution a developer opens locally, rather than a
      # parallel configuration that drifts.
      - name: Configure
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd.HHmm')
          $sha = git rev-parse --short HEAD
          $suffix = if ('${{ matrix.sanitize }}' -eq 'ON') { '~sanitized' } else { '' }
          cmake --preset windows-x64 -D DRAGONPERCH_VERSION_SUFFIX="~$stamp.g$sha$suffix" -D DRAGONPERCH_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build/windows-x64 --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build/windows-x64 --build-config ${{ matrix.configuration }} --output-on-failure

      # Pinned rather than trusting whatever the image ships: the shell targets
      # net10.0-windows10.0.26100.0, and a runner that quietly has only .NET 8 would fail
      # with a restore error that says nothing about why.
      - uses: actions/setup-dotnet@v6
        if: matrix.configuration == 'Release'
        with:
          dotnet-version: '10.0.x'

      # The Fluent tray menu, which is a separate program in a separate language built by
      # a separate tool -- see docs/plan.md 13.3. Deliberately not wired into CMake: CMake
      # cannot sensibly build a WinUI project, and the daemon has to keep building with no
      # .NET anywhere near it. Release only; there is nothing here a Debug daemon helps
      # with.
      - name: Build the shell
        if: matrix.configuration == 'Release'
        run: dotnet publish shell/windows/DragonPerch.Shell.csproj -c Release -o dist/shell

      # No installer, just the pieces: the executable next to the artwork it looks for, in
      # the layout find_sprite_packs expects when they sit side by side. Zipped here rather
      # than in the release job, so the name can carry the version the way the .deb and the
      # tarball do -- two nightlies in a downloads folder should be tellable apart.
      - name: Package
        if: matrix.configuration == 'Release'
        run: |
          New-Item -ItemType Directory -Force staging\assets, dist | Out-Null
          Copy-Item build\windows-x64\src\win\Release\dragonperch.exe staging\
          if ('${{ matrix.sanitize }}' -eq 'ON') {
              Copy-Item build\windows-x64\src\win\Release\*.dll staging\ -ErrorAction SilentlyContinue
              Copy-Item build\windows-x64\src\win\Release\*.pdb staging\ -ErrorAction SilentlyContinue
          }
          Copy-Item -Recurse assets\konqi, assets\katie, assets\kori staging\assets\
          Get-ChildItem -Recurse staging\assets -Directory -Filter source | Remove-Item -Recurse -Force
          $version = (Get-Content build\windows-x64/version.txt -Raw).Trim()
          Compress-Archive staging\* "dist\dragonperch_${version}_x64.zip"

      # The published shell, started once and asked to put a window on the screen.
      #
      # Not a nicety. The AOT build is not the build anybody develops against, and it can
      # fail where the other one does not: casting an object out of a ResourceDictionary is
      # a QueryInterface, and under Native AOT one of those answered E_NOINTERFACE and ended
      # the process before the menu appeared. Every local measurement had been taken on
      # `dotnet build` output, which does not AOT-compile, so the artifact CI published was
      # the only build with the bug in it and nothing ever ran it.
      #
      # `--settings` rather than `--menu`, because a window is enough to prove XAML started
      # and needs no cursor. The shell exits immediately if no daemon is running, so one is
      # started first and stopped after.
      - name: Smoke-test the published shell
        if: matrix.configuration == 'Release'
        run: |
          $daemon = Start-Process build\windows-x64\src\win\Release\dragonperch.exe -PassThru
          Start-Sleep -Seconds 5
          $shell = Start-Process dist\shell\DragonPerch.Shell.exe -ArgumentList '--settings' -PassThru

          # Polled rather than slept at, so a cold runner is given time without every run
          # paying for it. Sixty seconds is far longer than the hundred or so milliseconds
          # this takes on a warm machine.
          $log = 'dist\shell\DragonPerch.Shell.log'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'settings: shown' -Quiet)) { break }
              if ($shell.HasExited) { break }
              Start-Sleep -Milliseconds 500
          }

          if (Test-Path $log) { Get-Content $log }

          $alive = -not $shell.HasExited
          Stop-Process -Id $shell.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path $log)) { throw 'the shell wrote no log at all' }
          if (-not (Select-String -Path $log -Pattern 'settings: shown' -Quiet)) {
              throw 'the shell never showed its window'
          }
          if (-not $alive) { throw 'the shell exited while its window was up' }
          Write-Host 'the published shell started and showed a window'

      # A zip of its own, because it is an order of magnitude larger than everything else
      # put together and nobody who only wants the pets should have to download it. The
      # daemon runs without it and falls back to a Win32 menu; unpacking this beside
      # dragonperch.exe is what turns that menu into a Fluent one.
      - name: Package the shell
        if: matrix.configuration == 'Release'
        run: |
          # The AOT linker's symbols are 21 MB of an 82 MB directory. Neither
          # NativeDebugSymbols=false nor filtering ResolvedFileToPublish stops them being
          # written, so they are dropped here, where the thing people download is made.
          Remove-Item dist/shell/*.pdb -Force -ErrorAction SilentlyContinue
          $version = (Get-Content build\windows-x64/version.txt -Raw).Trim()
          Compress-Archive dist/shell/* "dist/dragonperch-shell_${version}_x64.zip"
          Remove-Item -Recurse -Force dist/shell

      - name: Upload the build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: dragonperch-windows-x64${{ matrix.sanitize == 'ON' && '-sanitized' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # clang-tidy, in a job of its own rather than bolted onto the build legs.
  #
  # It re-parses every translation unit, so putting it in the matrix would slow the builds
  # that produce the packages for an answer that has nothing to do with them. A separate
  # job also means its failure reads as "the analyser objected" rather than "Linux Release
  # broke".
  #
  # Debug, because the analyser does not care and a Debug build is quicker to get to.
  analyse:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the Wayland head's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-bin libwayland-dev libwayland-egl-backend-dev libegl-dev libgles-dev libpng-dev libsystemd-dev

      - uses: ./.github/actions/llvm
        with:
          analysis-tools: 'true'

      - name: Configure
        run: cmake --preset linux-x64 -D DRAGONPERCH_TIDY=ON

      # The core first and on its own, so that a finding there is not buried under the
      # Wayland head's -- the core is the half that has to stay portable and is the half
      # every other target is built on.
      # `-k 0` tells ninja to keep going after a failure instead of stopping at the first
      # one. Without it a run reports whichever file failed earliest and nothing about the
      # rest, so a handful of independent findings take a handful of round trips to see --
      # which is exactly how this went. The step still fails; it just says everything first.
      - name: Analyse the core
        run: cmake --build build/linux-x64 --config Debug --target dragonperch_core -- -k 0

      - name: Analyse everything else
        run: cmake --build build/linux-x64 --config Debug -- -k 0

  # A single rolling "nightly" pre-release holding the latest packages, replaced each time.
  # Pull requests deliberately do not publish: they build and test, and that is all a
  # proposed change has earned.
  nightly:
    name: nightly release
    # Every job, not just the ones that produce the files. `analyse` was missing, so a
    # clang-tidy failure published a release anyway -- the packages were built by jobs that
    # had passed, and nothing was watching the one that had not.
    #
    # `needs` waits for every leg of a matrix and requires all of them, so the sanitized
    # builds gate this too. That is deliberate: a sanitizer report is a defect, and a
    # nightly built from a commit with one should not be offered to anybody.
    needs: [linux, windows, analyse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Before anything is downloaded, let alone published. `needs:` above is the only
      # thing standing between a failing job and a release, and it is a list somebody has
      # to remember to add to. This checks they did.
      - name: Every job must gate this one
        run: python3 tools/check_release_gate.py

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deleted and recreated rather than edited, so the tag always points at the commit
          # the packages were actually built from. The files themselves are versioned, so a
          # rolling tag costs nothing: what somebody downloaded is written on it.
          gh release delete nightly --cleanup-tag --yes || true

          # Everything except the sanitized build. That one is a debugging aid, several
          # times slower and only useful to somebody chasing a crash, and it must not be
          # offered as a download beside the real thing. It stays a CI artifact, whose
          # fourteen-day retention is exactly the right lifetime for it.
          #
          # Not only tidiness: the two .deb files carry the same package name, and dpkg
          # orders `0.1.0~STAMP` BEFORE `0.1.0~STAMP-sanitized` -- an absent Debian
          # revision sorts before a named one -- so apt shown both would have called the
          # instrumented build the newer one. That is also why the suffix is now a tilde,
          # which sorts before everything, rather than the hyphen it started as.
          # Counted first: `gh release create` with no files makes an empty release rather
          # than complaining, so a change that broke the artifact names would publish a
          # nightly with nothing in it and report success.
          files=$(find dist -type f -not -path '*sanitized*')
          test -n "$files"
          echo "publishing $(echo "$files" | wc -l) file(s)"

          gh release create nightly $files --prerelease --title "Nightly build" --notes "Built from ${{ github.sha }}. Every file carries the build time and the commit in its version, so apt upgrades one nightly to the next. Unsigned and untested beyond CI. The dragonperch-shell zip is optional and only for Windows: it is the Fluent tray menu, and unpacking it beside dragonperch.exe replaces the plain Win32 one. The pets do not need it."
