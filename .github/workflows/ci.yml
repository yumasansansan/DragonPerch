name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both images ship everything this project needs, so there is no install step anywhere in
# this file. windows-2025-vs2026 carries Visual Studio Enterprise 2026, CMake 4.4 and
# Ninja; ubuntu-26.04 carries Clang 22, GCC 15, CMake 4.4 and Ninja. Installing any of it
# again would only pin an older version than the image already has.
jobs:
  # The portability guard. The core must build with no platform anything; if this job
  # breaks, a backend has leaked upwards, which is the one rule the cross-platform design
  # rests on. It runs on its own so the failure is unambiguous.
  core:
    name: core only (Clang 22)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset linux-clang
      - run: cmake --build build/linux-clang --config Debug --target dragonperch_core

  windows:
    name: windows (MSVC, VS 2026)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      # The Visual Studio generator, not Ninja: the image has VS 2026, so CI can build
      # through exactly the same solution a developer opens locally rather than a parallel
      # configuration that drifts. It also sets up its own environment, so no
      # msvc-dev-cmd step is needed.
      - run: cmake --preset windows-x64
      - run: cmake --build build/windows-x64 --config ${{ matrix.configuration }}

  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Two compilers rather than one. They disagree about enough of C++23 that building
        # with both is the cheapest portability check available, and warnings-as-errors
        # means each one's diagnostics are enforced.
        compiler: [clang, gcc]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset linux-${{ matrix.compiler }}
      - run: cmake --build build/linux-${{ matrix.compiler }} --config ${{ matrix.configuration }}
