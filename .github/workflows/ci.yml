# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

  # A nightly rebuild as well as one per push, so that a package is never more than a day
  # older than its dependencies -- a build that stopped working because Ubuntu moved
  # underneath it should be found by CI rather than by somebody installing the package.
  # 18:00 UTC is 03:00 in JST.
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

# No toolchain setup anywhere in this file. Both images already carry everything:
# ubuntu-26.04 has Clang 22, CMake and Ninja; windows-2025-vs2026 has Visual Studio 2026,
# and the Visual Studio generator configures MSVC itself. Installing any of it again could
# only pin something older than the image already has.
#
# The apt step on the Linux job is a different thing: those are the *dependencies* the
# Wayland head links against, not a compiler. The image has no reason to carry them.
jobs:
  linux:
    name: linux (Clang 22, ${{ matrix.configuration }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      # The Wayland protocol definitions are submodules -- see cmake/WaylandProtocol.cmake
      # for why they are not copied into the tree.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # wayland-scanner turns the protocol XML into C; the rest is what the head links
      # against. libsystemd is there for sd-bus, which is how the KWin script reaches us.
      - name: Install the Wayland head's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-bin libwayland-dev libwayland-egl-backend-dev libegl-dev libgles-dev libpng-dev libsystemd-dev

      # The preset names clang-22 rather than clang, because plain `clang` on this image is
      # 21 and picking up a different compiler than intended is the kind of thing that only
      # shows up as a confusing diagnostic much later.
      # The version carries the build time and the commit, so that apt can tell one
      # nightly from the next -- see cmake/Packaging.cmake for why the tilde matters.
      - name: Configure
        run: cmake --preset linux-x64 -D DRAGONPERCH_VERSION_SUFFIX="~$(date -u +%Y%m%d.%H%M).g$(git rev-parse --short HEAD)"

      # The portability guard, built first and named so its failure is unambiguous. The core
      # must compile with no platform anything; if this step breaks, a backend has leaked
      # upwards, which is the one rule the cross-platform design rests on.
      - name: Build core only (portability guard)
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }} --target dragonperch_core

      - name: Build everything
        run: cmake --build build/linux-x64 --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build/linux-x64 --build-config ${{ matrix.configuration }} --output-on-failure

      # Release only. A Debug package would be several times the size and slower for no
      # reason anybody downloading it would want.
      - name: Package
        if: matrix.configuration == 'Release'
        run: cpack -C Release
        working-directory: build/linux-x64

      - name: Upload the packages
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: dragonperch-linux-x86_64
          path: |
            build/linux-x64/*.deb
            build/linux-x64/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows (MSVC, ${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      # CI builds through the same solution a developer opens locally, rather than a
      # parallel configuration that drifts.
      - name: Configure
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd.HHmm')
          $sha = git rev-parse --short HEAD
          cmake --preset windows-x64 -D DRAGONPERCH_VERSION_SUFFIX="~$stamp.g$sha"

      - name: Build
        run: cmake --build build/windows-x64 --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build/windows-x64 --build-config ${{ matrix.configuration }} --output-on-failure

      # No installer, just the pieces: the executable next to the artwork it looks for, in
      # the layout find_sprite_packs expects when they sit side by side. Zipped here rather
      # than in the release job, so the name can carry the version the way the .deb and the
      # tarball do -- two nightlies in a downloads folder should be tellable apart.
      - name: Package
        if: matrix.configuration == 'Release'
        run: |
          New-Item -ItemType Directory -Force staging\assets, dist | Out-Null
          Copy-Item build\windows-x64\src\win\Release\dragonperch.exe staging\
          Copy-Item -Recurse assets\konqi, assets\katie, assets\kori staging\assets\
          Get-ChildItem -Recurse staging\assets -Directory -Filter source | Remove-Item -Recurse -Force
          $version = (Get-Content build\windows-x64/version.txt -Raw).Trim()
          Compress-Archive staging\* "dist\dragonperch_${version}_x64.zip"

      - name: Upload the build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: dragonperch-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # A single rolling "nightly" pre-release holding the latest packages, replaced each time.
  # Pull requests deliberately do not publish: they build and test, and that is all a
  # proposed change has earned.
  nightly:
    name: nightly release
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deleted and recreated rather than edited, so the tag always points at the commit
          # the packages were actually built from. The files themselves are versioned, so a
          # rolling tag costs nothing: what somebody downloaded is written on it.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly $(find dist -type f) --prerelease --title "Nightly build" --notes "Built from ${{ github.sha }}. Every file carries the build time and the commit in its version, so apt upgrades one nightly to the next. Unsigned and untested beyond CI."
