;
; Japanese. One file per language, and a language that is not installed simply falls back to
; the English the call site carries -- see src/core/dragonperch/language.hpp.
;
; The key is an id, not the English. An English sentence may contain '=' or ';' or '#',
; every one of which this file format would read as punctuation, and rewording the English
; would silently orphan the translation.

[Strings]

; The tray menu, on both platforms and in all three programs that draw one.
menu.pause = 一時停止
menu.resume = 再開
menu.settings = 設定...
menu.quit = DragonPerch を終了

; The settings window on Windows and the settings module on Linux. The same words, because
; they are the same settings.
settings.pets = マスコットごとの竜の数
settings.pets.note = マスコット3体を各2体にすると6体になります。
settings.mascots = マスコット
settings.mascots.note = どの竜を歩かせるか。すべて外すのは、すべて選ぶのと同じです。
settings.mascots.none = デーモンの隣にスプライトパックが見つかりません。
; The KDE page splits the note in two, because Kirigami puts the label beside the
; control rather than above it and the long form does not fit there.
settings.mascots.note.short = すべて外すのは、すべて選ぶのと同じです。
settings.speed = 歩く速さ
settings.speed.note = 1秒あたりのピクセル数。歩行アニメーションは42を想定して描かれています。速すぎると足が滑り、遅すぎるとムーンウォークになります。
settings.idle = ときどき立ち止まる
settings.idle.note = 自発的に立ち止まるまでの平均秒数。0にすると立ち止まらなくなります。
settings.monitors = モニタ
settings.monitors.note = 竜が歩いてよい場所。すべて外すのは、すべて選ぶのと同じです。
settings.fullscreen = 全画面のアプリを邪魔しない
settings.fullscreen.note = 全画面表示中のモニタでは竜を隠します。
settings.on = オン
settings.off = オフ
settings.close = 閉じる
settings.apply = 適用
settings.saved = 保存しました。
settings.saved.not-running = 保存しました。DragonPerch は実行されていません。
settings.save-failed = 設定を書き込めませんでした
settings.not-running = DragonPerch は実行されていません。ここで保存した内容は、次回の起動時に読み込まれます。
